[build]
  command = "bundle exec rake vite:build && bundle exec middleman build --clean"
  publish = "build"

[build.environment]
  RUBY_VERSION = "3.2.2"
  NODE_VERSION = "24.15.0"

[[headers]]
  for = "/*"
  [headers.values]
    # Detect and mitigate certain types of attacks, including Cross Site
    # Scripting (XSS) and data injection attacks.
    Content-Security-Policy = '''
      connect-src: 'self' consent.studio *.googlesyndication.com;
      default-src 'self' *.mailerlite.com consent.studio *.googlesyndication.com plausible.io;
      font-src 'self' fonts.gstatic.com;
      img-src 'self' data: *.cloudinary.com *.cloudfront.net *.facebook.com *.mailerlite.com *.googlesyndication.com *.googletagmanager.com;
      object-src 'none';
      script-src 'self' 'unsafe-inline' capi-automation.s3.us-east-2.amazonaws.com *.googletagmanager.com *.mailerlite.com assets.mlcdn.com connect.facebook.net consent.studio plausible.io s3.amazonaws.com app.bentonow.com;
      style-src 'self' 'unsafe-inline' consent.studio fonts.googleapis.com;
      '''

    # Send the origin, path, and querystring when performing a same-origin
    # request, only send the origin when the protocol security level stays the
    # same while performing a cross-origin request (HTTPS→HTTPS), and send no
    # header to any less-secure destinations (HTTPS→HTTP).
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Only respond with documents of the correct MIME types, ie text/html for
    # pages, text/css for styles, and one of the Javascript MIME types for
    # scripts.
    X-Content-Type-Options = "nosniff"

    # Only allow ourselves to embed our content in iframes etc
    X-Frame-Options = "SAMEORIGIN"
